org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Flutter 3.44's Gradle tooling still applies KGP to plugin projects
# (temporary allowance) and does not support AGP 9's new DSL, so both
# AGP 9 opt-outs must stay until Flutter completes the transition.
# The plugin's build.gradle.kts already carries the dual-compat
# Built-in Kotlin pattern for when that day comes.
android.builtInKotlin=false
android.newDsl=false
