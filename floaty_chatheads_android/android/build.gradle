plugins {
    id "com.android.library"
}

group 'ni.devotion.floaty_chatheads'
version '1.0-SNAPSHOT'

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'ni.devotion.floaty_chatheads'
    }

    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    defaultConfig {
        minSdkVersion 24
    }

    dependencies {
        implementation 'com.facebook.rebound:rebound:0.3.8'
        implementation 'com.google.android.material:material:1.12.0'
        implementation 'androidx.core:core-ktx:1.15.0'
        implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
        testImplementation 'org.jetbrains.kotlin:kotlin-test'
        testImplementation 'org.mockito:mockito-core:5.0.0'
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

// Backwards-compatible Built-in Kotlin pattern (Flutter 3.27 – 3.44+).
//
// - On AGP < 9 (Flutter 3.27 – 3.43): the Kotlin Gradle Plugin is not
//   provided by Flutter, so we apply it explicitly. These Flutter
//   versions do not emit the "plugin applies KGP" warning.
// - On AGP >= 9 (Flutter 3.44+): Built-in Kotlin is in effect and
//   Flutter provides KGP via its own Gradle plugin. We skip the
//   explicit apply, so this plugin is *not* listed in Flutter's KGP
//   warning.
//
// Either way the `kotlin { compilerOptions {} }` block below is the
// modern replacement for the legacy `android { kotlinOptions {} }`
// block and works once KGP 2.0+ is on the classpath (Flutter 3.27+).
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int

if (agpMajor < 9) {
    apply plugin: 'kotlin-android'
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}

