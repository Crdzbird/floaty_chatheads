plugins {
    id "com.android.library"
}

group 'ni.devotion.floaty_chatheads'
version '1.0-SNAPSHOT'

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'ni.devotion.floaty_chatheads'
    }

    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    defaultConfig {
        minSdkVersion 24
    }

    dependencies {
        implementation 'com.facebook.rebound:rebound:0.3.8'
        implementation 'com.google.android.material:material:1.12.0'
        implementation 'androidx.core:core-ktx:1.15.0'
        implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
        testImplementation 'org.jetbrains.kotlin:kotlin-test'
        testImplementation 'org.mockito:mockito-core:5.0.0'
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

// Built-in Kotlin (Flutter 3.44+) — KGP is provided by the Flutter
// Gradle Plugin, so the kotlin-android plugin declaration is removed
// from `plugins {}` above and the legacy `android { kotlinOptions {} }`
// block is replaced by the top-level `kotlin { compilerOptions {} }`
// block below.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}
